# Kuda monorepo CI.
#
# Runs on ubuntu-latest (Ubuntu 24.04). Every dependency is installed from
# the Ubuntu 24.04 apt archive (verified with `apt-cache policy` on a 24.04
# host: gcc, cmake, llvm-19, ats2-lang and nim all have 24.04 candidates).
# No GPU is present on the runners and none is needed: the AMD GFX1100
# assembly is only assembled with llvm-mc, never executed, and no CUDA,
# benchmark or device run is part of this workflow.
#
# Scope, stated honestly:
# - snapkitty-heterogeneous builds from its 5 shipped runtime sources only.
#   The other 9 sources listed in its CMakeLists.txt were never dropped
#   upstream and are excluded by design; the CMakeLists EXISTS guard skips
#   them with a configure-time warning instead of failing. They must not
#   be stubbed or invented to make the build look more complete.
# - Every step below was verified to exit 0 on the current tree. Nothing
#   here claims a pass for work that is not actually run.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: top-level gate (make check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Fail-closed tree gate: no stray script files, AGPLv3 LICENSE present.
      - name: make check
        run: make check

  occam-gpu:
    name: occam-gpu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc ats2-lang
      - name: build.sh
        working-directory: occam-gpu
        run: bash build.sh
      - name: make ats2
        working-directory: occam-gpu
        run: make ats2

  vm-abi:
    name: vm-abi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc ats2-lang
      - name: build.sh
        working-directory: vm-abi
        run: bash build.sh
      - name: make ats2
        working-directory: vm-abi
        run: make ats2

  nim-algorithm-layer:
    name: nim-algorithm-layer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y nim
      - name: nimble build
        working-directory: nim-algorithm-layer
        run: nimble build
      - name: nimble test
        working-directory: nim-algorithm-layer
        run: nimble test

  snapkitty-heterogeneous:
    name: snapkitty-heterogeneous
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc cmake
      # Build dir lives under the runner temp dir, never in the tree.
      # The 9 runtime sources absent upstream are skipped by the
      # CMakeLists EXISTS guard (configure-time warnings, by design);
      # only the 5 shipped sources are built.
      - name: cmake configure
        run: cmake -S snapkitty-heterogeneous -B ${{ runner.temp }}/build-skhetero -DCMAKE_BUILD_TYPE=Release
      - name: cmake build
        run: cmake --build ${{ runner.temp }}/build-skhetero --parallel 4
      - name: ctest
        run: ctest --test-dir ${{ runner.temp }}/build-skhetero --output-on-failure

  native-execution:
    name: native-execution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc cmake
      # Build dir lives under the runner temp dir, never in the tree.
      - name: cmake configure
        run: cmake -S native-execution -B ${{ runner.temp }}/build-native -DCMAKE_BUILD_TYPE=Release
      - name: cmake build
        run: cmake --build ${{ runner.temp }}/build-native --parallel 4
      - name: ctest
        run: ctest --test-dir ${{ runner.temp }}/build-native --output-on-failure

  ucode-disasm:
    name: ucode-disasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc
      - name: compile
        run: cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic ucode-disasm/ucode_disasm.c -o ${{ runner.temp }}/ucode_disasm
      - name: run (built-in sample dump)
        run: ${{ runner.temp }}/ucode_disasm
      - name: run --csv (built-in sample dump)
        run: ${{ runner.temp }}/ucode_disasm --csv

  llvm-mc:
    name: llvm-mc gfx1100 assemble
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y llvm-19
      # The --triple is REQUIRED: without it llvm-mc defaults to x86-64
      # and rejects the AMD GCN assembly. Assembly only; never executed.
      - name: assemble vec_add_gfx1100.s
        run: llvm-mc-19 --triple=amdgcn-amd-amdhsa --mcpu=gfx1100 snapkitty/asm/vec_add_gfx1100.s -o ${{ runner.temp }}/vec_add_gfx1100.o

  patsopt:
    name: patsopt typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y ats2-lang
      # patsopt resolves staload paths relative to the working directory,
      # so each check runs from the directory holding the .dats file.
      - name: vm-abi abi_contract.dats
        working-directory: vm-abi/proofs
        run: patsopt -tc -d abi_contract.dats
      - name: occam-gpu gpu_ir_contract.dats
        working-directory: occam-gpu/proofs
        run: patsopt -tc -d gpu_ir_contract.dats
      - name: snapkitty vec_add_verify.dats
        working-directory: snapkitty/proofs
        run: patsopt -tc -d vec_add_verify.dats
      - name: vm-abi tests test_ats2_proofs.dats
        working-directory: vm-abi/tests
        run: patsopt -tc -d test_ats2_proofs.dats
