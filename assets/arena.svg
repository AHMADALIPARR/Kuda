<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0 0 720 150" font-family="monospace" font-size="13">
  <rect width="720" height="150" fill="#0d1117"/>
  <text x="20" y="28" fill="#e6edf3" font-size="15" font-weight="bold">Bounded arena</text>
  <text x="20" y="52" fill="#8b949e" font-size="11">base</text>
  <text x="640" y="52" fill="#8b949e" font-size="11">base + capacity</text>
  <g font-size="12">
    <rect x="20" y="62" width="170" height="40" fill="#1f2a1f" stroke="#3fb950"/>
    <text x="105" y="86" fill="#e6edf3" text-anchor="middle">previously used</text>
    <rect x="190" y="62" width="60" height="40" fill="#161b22" stroke="#30363d"/>
    <text x="220" y="86" fill="#8b949e" text-anchor="middle">pad</text>
    <rect x="250" y="62" width="170" height="40" fill="#1f2a1f" stroke="#3fb950"/>
    <text x="335" y="86" fill="#e6edf3" text-anchor="middle">new allocation</text>
    <rect x="420" y="62" width="280" height="40" fill="#161b22" stroke="#30363d"/>
    <text x="560" y="86" fill="#8b949e" text-anchor="middle">available</text>
  </g>
  <text x="20" y="128" fill="#8b949e" font-size="11">used → aligned start → new used · rewind restores a saved mark · test: 256 bytes, 32-byte alloc at 16-byte alignment</text>
