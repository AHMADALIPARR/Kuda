<svg xmlns="http://www.w3.org/2000/svg" width="720" height="150" viewBox="0 0 720 150" font-family="monospace" font-size="13">
  <rect width="720" height="150" fill="#0d1117"/>
  <text x="20" y="28" fill="#e6edf3" font-size="15" font-weight="bold">32-bit microcode word</text>
  <text x="20" y="52" fill="#8b949e" font-size="11">bit 31</text>
  <text x="660" y="52" fill="#8b949e" font-size="11">bit 0</text>
  <g font-size="12">
    <rect x="20" y="62" width="90" height="40" fill="#161b22" stroke="#3fb950"/>
    <text x="65" y="80" fill="#e6edf3" text-anchor="middle">OP</text>
    <text x="65" y="96" fill="#8b949e" font-size="10" text-anchor="middle">31:28 · 4</text>
    <rect x="110" y="62" width="90" height="40" fill="#161b22" stroke="#30363d"/>
    <text x="155" y="80" fill="#e6edf3" text-anchor="middle">SUB</text>
    <text x="155" y="96" fill="#8b949e" font-size="10" text-anchor="middle">27:24 · 4</text>
    <rect x="200" y="62" width="90" height="40" fill="#161b22" stroke="#30363d"/>
    <text x="245" y="80" fill="#e6edf3" text-anchor="middle">MOD</text>
    <text x="245" y="96" fill="#8b949e" font-size="10" text-anchor="middle">23:20 · 4</text>
    <rect x="290" y="62" width="180" height="40" fill="#161b22" stroke="#30363d"/>
    <text x="380" y="80" fill="#e6edf3" text-anchor="middle">RSV</text>
    <text x="380" y="96" fill="#8b949e" font-size="10" text-anchor="middle">19:12 · 8</text>
    <rect x="470" y="62" width="230" height="40" fill="#161b22" stroke="#30363d"/>
    <text x="585" y="80" fill="#e6edf3" text-anchor="middle">IMM</text>
    <text x="585" y="96" fill="#8b949e" font-size="10" text-anchor="middle">11:0 · 12</text>
  </g>
  <text x="20" y="128" fill="#8b949e" font-size="11">4 + 4 + 4 + 8 + 12 = 32 bits · example 0x12345ABC → OP=1 SUB=2 MOD=3 RSV=0x45 IMM=0xABC</text>
</svg>
